# Built by Coolify from the Dockerfiles in /docker.
# Fuseki is the one shared with the other apps (shared-infra): the backend joins the "coolify"
# network to reach it. Coolify writes SERVICE_FQDN_* and the variables set in its UI in .env.

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.dockerfile
    restart: always
    depends_on:
      - cocreation-redis
    expose:
      - '3000'
    networks:
      - coolify
    environment:
      SEMAPPS_APP_NAME: ${APP_NAME:-Cocréation}
      SEMAPPS_APP_DESCRIPTION: ${APP_DESCRIPTION:-Créer et modifier des applications ensemble, en discutant}
      SEMAPPS_APP_LANG: fr
      SEMAPPS_HOME_URL: https://${SERVICE_FQDN_BACKEND}/api/
      SEMAPPS_FRONT_URL: https://${SERVICE_FQDN_FRONTEND}/
      SEMAPPS_PORT: '3000'
      SEMAPPS_SHAPE_REPOSITORY_URL: https://shapes.activitypods.org/
      SEMAPPS_SPARQL_ENDPOINT: ${SPARQL_ENDPOINT}
      SEMAPPS_JENA_USER: ${JENA_USER:-admin}
      SEMAPPS_JENA_PASSWORD: ${JENA_PASSWORD}
      SEMAPPS_MAIN_DATASET: cocreation
      SEMAPPS_AUTH_ACCOUNTS_DATASET_NAME: settings-cocreation
      SEMAPPS_REDIS_CACHE_URL: redis://cocreation-redis:6379/0
      SEMAPPS_QUEUE_SERVICE_URL: redis://cocreation-redis:6379/1
    volumes:
      - backend-logs:/app/backend/logs
      # Keys generated on first start; losing them invalidates every issued token
      - backend-jwt:/app/backend/jwt

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.dockerfile
      # Inlined by Vite at build time
      args:
        VITE_APP_NAME: ${APP_NAME:-Cocréation}
        VITE_APP_DESCRIPTION: ${APP_DESCRIPTION:-Créer et modifier des applications ensemble, en discutant}
        VITE_APP_LANG: fr
        VITE_BACKEND_URL: https://${SERVICE_FQDN_BACKEND}/api/
        VITE_BACKEND_CLIENT_ID: https://${SERVICE_FQDN_BACKEND}/api/app
        VITE_SHAPE_REPOSITORY_URL: https://shapes.activitypods.org/
        VITE_POD_PROVIDER_BASE_URL: https://mypod.store
    restart: always
    depends_on:
      - backend
    expose:
      - '4000'

  cocreation-redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data

volumes:
  backend-logs:
  backend-jwt:
  redis-data:

networks:
  coolify:
    external: true
